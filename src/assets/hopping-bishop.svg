<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Hopping Bishop</title>
  <desc id="desc">A bishop jumps over exactly one piece on a diagonal to land beyond.</desc>
  <!--
    Pieces: Colin M.L. Burnett (Cburnett) chess set
    Licensed under GPL / BSD / GFDL (Wikipedia / Lichess).
  -->

  <rect width="240" height="240" fill="#0a0a0a"/>

  <!-- Diagonal squares -->
  <g stroke="#1e2a24" stroke-width="1">
    <rect x="36" y="148" width="40" height="40" fill="#121816"/>
    <rect x="76" y="108" width="40" height="40" fill="#1a2420"/>
    <rect x="116" y="68" width="40" height="40" fill="#121816"/>
    <rect x="156" y="28" width="40" height="40" fill="#1a2420"/>
  </g>

  <!-- Hopped-over square -->
  <rect x="76" y="108" width="40" height="40" fill="#d6a83a" fill-opacity="0.2" stroke="#d6a83a" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Landing square -->
  <rect x="156" y="28" width="40" height="40" fill="#2a8c62" fill-opacity="0.32"/>

  <!-- Arc hop path over the middle piece -->
  <defs>
    <marker id="hb-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3ecf8e"/>
    </marker>
  </defs>
  <path d="M56 168 Q 96 40 176 48" fill="none" stroke="#3ecf8e" stroke-width="3.25" stroke-linecap="round" marker-end="url(#hb-arrow)"/>

  <!-- Straight diagonal under the hop (implied blocked line) -->
  <path d="M56 168 L176 48" fill="none" stroke="#3ecf8e" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="4 5"/>

  <!-- Piece being hopped over (enemy or any) -->
  <g transform="translate(73.5 103) scale(1.0)">
    <path fill="#2a3030" stroke="#c8d0cc" stroke-linecap="round" stroke-width="1.5" d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z"/>
  </g>

  <!-- Ghost bishop at landing -->
  <g opacity="0.3" transform="translate(153.5 23) scale(1.0)">
    <g fill="none" fill-rule="evenodd" stroke="#3ecf8e" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <g fill="#3ecf8e" fill-opacity="0.4" stroke-linecap="butt">
        <path d="M9 36c3.39-.97 10.11.43 13.5-2 3.39 2.43 10.11 1.03 13.5 2 0 0 1.65.54 3 2-.68.97-1.65.99-3 .5-3.39-.97-10.11.46-13.5-1-3.39 1.46-10.11.03-13.5 1-1.35.49-2.32.47-3-.5 1.35-1.94 3-2 3-2z"/>
        <path d="M15 32c2.5 2.5 12.5 2.5 15 0 .5-1.5 0-2 0-2 0-2.5-2.5-4-2.5-4 5.5-1.5 6-11.5-5-15.5-11 4-10.5 14-5 15.5 0 0-2.5 1.5-2.5 4 0 0-.5.5 0 2z"/>
        <path d="M25 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 1 1 5 0z"/>
      </g>
      <path stroke-linejoin="miter" d="M17.5 26h10M15 30h15m-7.5-14.5v5M20 18h5"/>
    </g>
  </g>

  <!-- Cburnett white bishop (start) -->
  <g transform="translate(33.5 143) scale(1.0)">
    <g fill="none" fill-rule="evenodd" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <g fill="#fff" stroke-linecap="butt">
        <path d="M9 36c3.39-.97 10.11.43 13.5-2 3.39 2.43 10.11 1.03 13.5 2 0 0 1.65.54 3 2-.68.97-1.65.99-3 .5-3.39-.97-10.11.46-13.5-1-3.39 1.46-10.11.03-13.5 1-1.35.49-2.32.47-3-.5 1.35-1.94 3-2 3-2z"/>
        <path d="M15 32c2.5 2.5 12.5 2.5 15 0 .5-1.5 0-2 0-2 0-2.5-2.5-4-2.5-4 5.5-1.5 6-11.5-5-15.5-11 4-10.5 14-5 15.5 0 0-2.5 1.5-2.5 4 0 0-.5.5 0 2z"/>
        <path d="M25 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 1 1 5 0z"/>
      </g>
      <path stroke-linejoin="miter" d="M17.5 26h10M15 30h15m-7.5-14.5v5M20 18h5"/>
    </g>
  </g>

  <!-- Small hop motion ticks above the arc -->
  <g fill="#3ecf8e">
    <circle cx="100" cy="72" r="2.5"/>
    <circle cx="128" cy="52" r="2.5"/>
  </g>
</svg>
