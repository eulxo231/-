<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Glass Queen</title>
  <desc id="desc">A queen captures an enemy piece and shatters, removing herself as well.</desc>
  <!--
    Queen: fixed Staunton card-art silhouette (see piece-queen.svg).
    Pawn: Colin M.L. Burnett (Cburnett), GPL / BSD / GFDL.
  -->

  <rect width="240" height="240" fill="#0a0a0a"/>

  <!-- Board squares on a diagonal -->
  <g stroke="#1e2a24" stroke-width="1">
    <rect x="40" y="140" width="44" height="44" fill="#121816"/>
    <rect x="84" y="96" width="44" height="44" fill="#1a2420"/>
    <rect x="128" y="52" width="44" height="44" fill="#121816"/>
  </g>

  <!-- Capture square -->
  <rect x="128" y="52" width="44" height="44" fill="#e85d4c" fill-opacity="0.2"/>

  <!-- Capture path -->
  <defs>
    <marker id="gq-arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#e85d4c"/>
    </marker>
  </defs>
  <path d="M62 162 L140 84" stroke="#e85d4c" stroke-opacity="0.7" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#gq-arrow)"/>

  <!-- Enemy piece (dark pawn) being captured -->
  <g transform="translate(127.5 47) scale(1.05)" opacity="0.55">
    <path fill="#2a3030" stroke="#c8d0cc" stroke-linecap="round" stroke-width="1.5" d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z"/>
  </g>

  <!-- Fixed Staunton queen (start) -->
  <g transform="translate(62 142) scale(0.17)">
    <path fill="#fff" stroke="#000" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" d="M-54 46C-54 38 -48 34 -42 34L-48 14L-34 34L-26 2L-14 34L0 -6L14 34L26 2L34 34L48 14L42 34C48 34 54 38 54 46L52 58C44 66 34 68 28 68L24 68C18 80 18 96 18 112L18 128C18 140 28 146 40 150L52 154C62 158 64 166 64 174L64 182C64 194 50 200 36 200L-36 200C-50 200 -64 194 -64 182L-64 174C-64 166 -62 158 -52 154L-40 150C-28 146 -18 140 -18 128L-18 112C-18 96 -18 80 -24 68L-28 68C-34 68 -44 66 -52 58Z"/>
    <g fill="#fff" stroke="#000" stroke-width="8">
      <circle cx="-48" cy="10" r="7.5"/>
      <circle cx="-26" cy="-2" r="7.5"/>
      <circle cx="0" cy="-10" r="8"/>
      <circle cx="26" cy="-2" r="7.5"/>
      <circle cx="48" cy="10" r="7.5"/>
    </g>
    <path d="M-42 58 L42 58" fill="none" stroke="#000" stroke-width="8" stroke-linecap="round"/>
    <path d="M-16 108 L16 108" fill="none" stroke="#000" stroke-width="7" stroke-linecap="round"/>
    <path d="M-18 124 L18 124" fill="none" stroke="#000" stroke-width="7" stroke-linecap="round"/>
    <path d="M-50 152 L50 152" fill="none" stroke="#000" stroke-width="7.5" stroke-linecap="round"/>
  </g>

  <!-- Shattered queen silhouette on capture square -->
  <g transform="translate(150 56) scale(0.17)" opacity="0.85">
    <path fill="#a8d4ff" fill-opacity="0.35" stroke="#7ec8ff" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" stroke-opacity="0.8" d="M-54 46C-54 38 -48 34 -42 34L-48 14L-34 34L-26 2L-14 34L0 -6L14 34L26 2L34 34L48 14L42 34C48 34 54 38 54 46L52 58C44 66 34 68 28 68L24 68C18 80 18 96 18 112L18 128C18 140 28 146 40 150L52 154C62 158 64 166 64 174L64 182C64 194 50 200 36 200L-36 200C-50 200 -64 194 -64 182L-64 174C-64 166 -62 158 -52 154L-40 150C-28 146 -18 140 -18 128L-18 112C-18 96 -18 80 -24 68L-28 68C-34 68 -44 66 -52 58Z"/>
    <g fill="#a8d4ff" fill-opacity="0.35" stroke="#7ec8ff" stroke-width="8" stroke-opacity="0.8">
      <circle cx="-48" cy="10" r="7.5"/>
      <circle cx="-26" cy="-2" r="7.5"/>
      <circle cx="0" cy="-10" r="8"/>
      <circle cx="26" cy="-2" r="7.5"/>
      <circle cx="48" cy="10" r="7.5"/>
    </g>
    <path d="M-42 58 L42 58" fill="none" stroke="#7ec8ff" stroke-width="8" stroke-linecap="round" stroke-opacity="0.8"/>
    <path d="M-16 108 L16 108" fill="none" stroke="#7ec8ff" stroke-width="7" stroke-linecap="round" stroke-opacity="0.8"/>
    <path d="M-18 124 L18 124" fill="none" stroke="#7ec8ff" stroke-width="7" stroke-linecap="round" stroke-opacity="0.8"/>
    <path d="M-50 152 L50 152" fill="none" stroke="#7ec8ff" stroke-width="7.5" stroke-linecap="round" stroke-opacity="0.8"/>
  </g>

  <!-- Glass shards bursting from capture -->
  <g fill="#7ec8ff" fill-opacity="0.85">
    <polygon points="156,48 164,42 160,54"/>
    <polygon points="178,58 188,56 182,68"/>
    <polygon points="170,90 180,94 172,102"/>
    <polygon points="140,44 146,36 150,46"/>
    <polygon points="132,78 124,84 134,88"/>
    <polygon points="190,78 198,72 196,84"/>
  </g>
  <g stroke="#a8d4ff" stroke-opacity="0.7" stroke-width="1.5" stroke-linecap="round" fill="none">
    <path d="M158 50 L172 38"/>
    <path d="M176 70 L194 66"/>
    <path d="M168 92 L184 104"/>
    <path d="M138 70 L122 86"/>
  </g>
</svg>
