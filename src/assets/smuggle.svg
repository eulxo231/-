<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Smuggle</title>
  <desc id="desc">A piece is moved to an empty square on the back two ranks.</desc>
  <!--
    Pieces: Colin M.L. Burnett (Cburnett) chess set
    Licensed under GPL / BSD / GFDL (Wikipedia / Lichess).
  -->

  <rect width="240" height="240" fill="#0a0a0a"/>

  <!-- Back two ranks (home zone) -->
  <g stroke="#1e2a24" stroke-width="1">
    <rect x="40" y="148" width="40" height="40" fill="#121816"/>
    <rect x="80" y="148" width="40" height="40" fill="#1a2420"/>
    <rect x="120" y="148" width="40" height="40" fill="#121816"/>
    <rect x="160" y="148" width="40" height="40" fill="#1a2420"/>
    <rect x="40" y="108" width="40" height="40" fill="#1a2420"/>
    <rect x="80" y="108" width="40" height="40" fill="#121816"/>
    <rect x="120" y="108" width="40" height="40" fill="#1a2420"/>
    <rect x="160" y="108" width="40" height="40" fill="#121816"/>
  </g>

  <!-- Highlight back-two-rank zone -->
  <rect x="40" y="108" width="160" height="80" fill="#2a8c62" fill-opacity="0.12" stroke="#3ecf8e" stroke-opacity="0.4" stroke-width="1.75" stroke-dasharray="5 4"/>

  <!-- Destination square -->
  <rect x="120" y="148" width="40" height="40" fill="#2a8c62" fill-opacity="0.32"/>

  <!-- Current / advanced square -->
  <rect x="152" y="40" width="40" height="40" fill="#1a2420" stroke="#1e2a24" stroke-width="1"/>
  <rect x="152" y="40" width="40" height="40" fill="#d6a83a" fill-opacity="0.16"/>

  <defs>
    <marker id="sm-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3ecf8e"/>
    </marker>
  </defs>

  <!-- Sneaky smuggle path (dashed) into the back ranks -->
  <path d="M172 60 C 210 70, 210 130, 140 168" fill="none" stroke="#3ecf8e" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#sm-arrow)"/>

  <!-- Ghost piece at destination -->
  <g opacity="0.3" transform="translate(117.5 151) scale(1.0)">
    <g fill="none" fill-rule="evenodd" stroke="#3ecf8e" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <path fill="#3ecf8e" fill-opacity="0.35" d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/>
      <path fill="#3ecf8e" fill-opacity="0.35" d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3"/>
      <path fill="#000" d="M9.5 25.5a.5.5 0 1 1-1 0 .5.5 0 1 1 1 0m5.433-9.75a.5 1.5 30 1 1-.866-.5.5 1.5 30 1 1 .866.5"/>
    </g>
  </g>

  <!-- Cburnett white knight (being smuggled) -->
  <g transform="translate(149.5 43) scale(1.0)">
    <g fill="none" fill-rule="evenodd" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <path fill="#fff" d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/>
      <path fill="#fff" d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3"/>
      <path fill="#000" d="M9.5 25.5a.5.5 0 1 1-1 0 .5.5 0 1 1 1 0m5.433-9.75a.5 1.5 30 1 1-.866-.5.5 1.5 30 1 1 .866.5"/>
    </g>
  </g>
</svg>
