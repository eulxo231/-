<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Coronation</title>
  <desc id="desc">A piece is crowned and becomes a queen.</desc>

  <rect width="240" height="240" fill="#0a0a0a"/>

  <!-- Soft board squares -->
  <g stroke="#1e2a24" stroke-width="1">
    <rect x="48" y="148" width="48" height="48" fill="#121816"/>
    <rect x="96" y="72" width="48" height="48" fill="#1a2420"/>
  </g>

  <!-- Coronation square -->
  <rect x="96" y="72" width="48" height="48" fill="#d6a83a" fill-opacity="0.22" stroke="#d6a83a" stroke-opacity="0.55" stroke-width="1.75"/>

  <!-- Crown rays -->
  <g stroke="#d6a83a" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round">
    <path d="M120 64 L120 46"/>
    <path d="M100 72 L86 56"/>
    <path d="M140 72 L154 56"/>
  </g>
  <g fill="#d6a83a">
    <circle cx="120" cy="46" r="2.5"/>
    <circle cx="86" cy="56" r="2"/>
    <circle cx="154" cy="56" r="2"/>
  </g>

  <defs>
    <marker id="cor-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a83a"/>
    </marker>
  </defs>

  <!-- Transform path: pawn -> queen -->
  <path d="M72 172 L72 120 L120 120" fill="none" stroke="#d6a83a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cor-arrow)"/>

  <!-- Source pawn -->
  <g transform="translate(50.5 151) scale(1.0)" opacity="0.55">
    <path fill="#fff" stroke="#000" stroke-linecap="round" stroke-width="1.5" d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z"/>
  </g>

  <!-- Queen (reference style), fitted inside the gold square -->
  <g transform="translate(120 75) scale(0.185)">
    <path
      fill="#fff"
      stroke="#000"
      stroke-width="8"
      stroke-linejoin="round"
      stroke-linecap="round"
      d="M-54 46
         C-54 38 -48 34 -42 34
         L-48 14
         L-34 34
         L-26 2
         L-14 34
         L0 -6
         L14 34
         L26 2
         L34 34
         L48 14
         L42 34
         C48 34 54 38 54 46
         L52 58
         C44 66 34 68 28 68
         L24 68
         C18 80 18 96 18 112
         L18 128
         C18 140 28 146 40 150
         L52 154
         C62 158 64 166 64 174
         L64 182
         C64 194 50 200 36 200
         L-36 200
         C-50 200 -64 194 -64 182
         L-64 174
         C-64 166 -62 158 -52 154
         L-40 150
         C-28 146 -18 140 -18 128
         L-18 112
         C-18 96 -18 80 -24 68
         L-28 68
         C-34 68 -44 66 -52 58
         Z"
    />

    <g fill="#fff" stroke="#000" stroke-width="8">
      <circle cx="-48" cy="10" r="7.5"/>
      <circle cx="-26" cy="-2" r="7.5"/>
      <circle cx="0" cy="-10" r="8"/>
      <circle cx="26" cy="-2" r="7.5"/>
      <circle cx="48" cy="10" r="7.5"/>
    </g>

    <path d="M-42 58 L42 58" fill="none" stroke="#000" stroke-width="8" stroke-linecap="round"/>
    <path d="M-16 108 L16 108" fill="none" stroke="#000" stroke-width="7" stroke-linecap="round"/>
    <path d="M-18 124 L18 124" fill="none" stroke="#000" stroke-width="7" stroke-linecap="round"/>
    <path d="M-50 152 L50 152" fill="none" stroke="#000" stroke-width="7.5" stroke-linecap="round"/>
  </g>
</svg>
