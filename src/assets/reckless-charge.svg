<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Reckless Charge</title>
  <desc id="desc">A knight that captures an enemy jumped over on its long orthogonal leap.</desc>
  <!--
    Pieces: Colin M.L. Burnett (Cburnett) chess set
    Licensed under GPL / BSD / GFDL (Wikipedia / Lichess).
  -->

  <rect width="240" height="240" fill="#0a0a0a"/>

  <!-- Board squares along the leap -->
  <g stroke="#1e2a24" stroke-width="1">
    <rect x="52" y="140" width="48" height="48" fill="#121816"/>
    <rect x="100" y="92" width="48" height="48" fill="#1a2420"/>
    <rect x="148" y="44" width="48" height="48" fill="#121816"/>
  </g>

  <!-- Jumped enemy square (captured) -->
  <rect x="100" y="92" width="48" height="48" fill="#e85d4c" fill-opacity="0.28" stroke="#e85d4c" stroke-opacity="0.75" stroke-width="2"/>

  <!-- Destination -->
  <rect x="148" y="44" width="48" height="48" fill="#d6a83a" fill-opacity="0.16" stroke="#d6a83a" stroke-opacity="0.55" stroke-width="1.5"/>

  <defs>
    <marker id="rc-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a83a"/>
    </marker>
  </defs>

  <!-- Knight L path: up-up then right, leaping the mid square -->
  <path d="M76 164 L124 116" fill="none" stroke="#d6a83a" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5"/>
  <path d="M124 116 L172 68" fill="none" stroke="#d6a83a" stroke-width="3.25" stroke-linecap="round" marker-end="url(#rc-arrow)"/>

  <!-- Capture X on leaped enemy -->
  <g stroke="#e85d4c" stroke-width="3" stroke-linecap="round">
    <path d="M112 104 L136 128"/>
    <path d="M136 104 L112 128"/>
  </g>

  <!-- Cburnett white knight start -->
  <g transform="translate(54.5 142.5) scale(0.95)">
    <g fill="none" fill-rule="evenodd" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <path fill="#fff" d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/>
      <path fill="#fff" d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3"/>
      <path fill="#000" d="M9.5 25.5a.5.5 0 1 1-1 0 .5.5 0 1 1 1 0m5.433-9.75a.5 1.5 30 1 1-.866-.5.5 1.5 30 1 1 .866.5"/>
    </g>
  </g>

  <!-- Dark enemy pawn leaped over -->
  <g transform="translate(103.5 94.5) scale(0.9)">
    <path fill="#2a3030" stroke="#c8d0cc" stroke-linecap="round" stroke-width="1.5" d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z"/>
  </g>
</svg>
