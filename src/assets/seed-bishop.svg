<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Seed Bishop</title>
  <desc id="desc">A bishop captures, then a pawn sprouts on the square it left.</desc>
  <!--
    Pieces: Colin M.L. Burnett (Cburnett) chess set
    Licensed under GPL / BSD / GFDL (Wikipedia / Lichess).
  -->

  <rect width="240" height="240" fill="#0a0a0a"/>

  <!-- Diagonal board squares -->
  <g stroke="#1e2a24" stroke-width="1">
    <rect x="40" y="140" width="44" height="44" fill="#121816"/>
    <rect x="84" y="96" width="44" height="44" fill="#1a2420"/>
    <rect x="128" y="52" width="44" height="44" fill="#121816"/>
  </g>

  <!-- Origin square (seed grows here) -->
  <rect x="40" y="140" width="44" height="44" fill="#2a8c62" fill-opacity="0.28" stroke="#3ecf8e" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- Capture square -->
  <rect x="128" y="52" width="44" height="44" fill="#e85d4c" fill-opacity="0.18"/>

  <!-- Capture path -->
  <defs>
    <marker id="sbd-arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#e85d4c"/>
    </marker>
  </defs>
  <path d="M62 162 L140 84" stroke="#e85d4c" stroke-opacity="0.65" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#sbd-arrow)"/>

  <!-- Enemy piece being captured -->
  <g transform="translate(127.5 47) scale(1.05)" opacity="0.5">
    <path fill="#2a3030" stroke="#c8d0cc" stroke-linecap="round" stroke-width="1.5" d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z"/>
  </g>

  <!-- Bishop after capture (on destination) -->
  <g transform="translate(127.5 47) scale(1.0)">
    <g fill="none" fill-rule="evenodd" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <g fill="#fff" stroke-linecap="butt">
        <path d="M9 36c3.39-.97 10.11.43 13.5-2 3.39 2.43 10.11 1.03 13.5 2 0 0 1.65.54 3 2-.68.97-1.65.99-3 .5-3.39-.97-10.11.46-13.5-1-3.39 1.46-10.11.03-13.5 1-1.35.49-2.32.47-3-.5 1.35-1.94 3-2 3-2z"/>
        <path d="M15 32c2.5 2.5 12.5 2.5 15 0 .5-1.5 0-2 0-2 0-2.5-2.5-4-2.5-4 5.5-1.5 6-11.5-5-15.5-11 4-10.5 14-5 15.5 0 0-2.5 1.5-2.5 4 0 0-.5.5 0 2z"/>
        <path d="M25 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 1 1 5 0z"/>
      </g>
      <path stroke-linejoin="miter" d="M17.5 26h10M15 30h15m-7.5-14.5v5M20 18h5"/>
    </g>
  </g>

  <!-- Sprouted pawn on vacated square -->
  <g transform="translate(39.5 135) scale(1.0)">
    <path fill="#fff" stroke="#000" stroke-linecap="round" stroke-width="1.5" d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z"/>
  </g>

  <!-- Seed / sprout sparkles around new pawn -->
  <g fill="#3ecf8e">
    <circle cx="52" cy="148" r="2"/>
    <circle cx="78" cy="172" r="2"/>
    <circle cx="46" cy="178" r="1.5"/>
    <circle cx="84" cy="150" r="1.5"/>
  </g>
  <g stroke="#3ecf8e" stroke-width="1.75" stroke-linecap="round" fill="none">
    <path d="M58 138 L58 130 M54 134 L62 134"/>
    <path d="M80 180 L80 174 M77 177 L83 177"/>
  </g>
</svg>
