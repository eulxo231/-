<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Teleport</title>
  <desc id="desc">The king moves to an empty square on the back rank.</desc>
  <!--
    Pieces: Colin M.L. Burnett (Cburnett) chess set
    Licensed under GPL / BSD / GFDL (Wikipedia / Lichess).
  -->

  <rect width="240" height="240" fill="#0a0a0a"/>

  <!-- Back rank -->
  <g stroke="#1e2a24" stroke-width="1">
    <rect x="40" y="148" width="40" height="40" fill="#121816"/>
    <rect x="80" y="148" width="40" height="40" fill="#1a2420"/>
    <rect x="120" y="148" width="40" height="40" fill="#121816"/>
    <rect x="160" y="148" width="40" height="40" fill="#1a2420"/>
  </g>

  <!-- Back-rank zone -->
  <rect x="40" y="148" width="160" height="40" fill="#2a8c62" fill-opacity="0.12" stroke="#3ecf8e" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Destination -->
  <rect x="120" y="148" width="40" height="40" fill="#2a8c62" fill-opacity="0.32"/>

  <!-- Origin (away from home) -->
  <rect x="152" y="48" width="40" height="40" fill="#1a2420" stroke="#1e2a24" stroke-width="1"/>
  <rect x="152" y="48" width="40" height="40" fill="#d6a83a" fill-opacity="0.16"/>

  <defs>
    <marker id="tp-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3ecf8e"/>
    </marker>
  </defs>

  <!-- Teleport beam (dashed portal path) -->
  <path d="M172 68 C 210 90, 200 140, 140 168" fill="none" stroke="#3ecf8e" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 6" marker-end="url(#tp-arrow)"/>

  <!-- Portal rings at origin and destination -->
  <circle cx="172" cy="68" r="22" fill="none" stroke="#3ecf8e" stroke-opacity="0.45" stroke-width="2"/>
  <circle cx="172" cy="68" r="14" fill="none" stroke="#3ecf8e" stroke-opacity="0.7" stroke-width="1.75" stroke-dasharray="4 3"/>
  <circle cx="140" cy="168" r="18" fill="none" stroke="#3ecf8e" stroke-opacity="0.55" stroke-width="2"/>

  <!-- Ghost king at destination -->
  <g opacity="0.3" transform="translate(117.5 151) scale(1.0)">
    <g fill="none" fill-rule="evenodd" stroke="#3ecf8e" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <path stroke-linejoin="miter" d="M22.5 11.63V6M20 8h5"/>
      <path fill="#3ecf8e" fill-opacity="0.35" stroke-linecap="butt" stroke-linejoin="miter" d="M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5"/>
      <path fill="#3ecf8e" fill-opacity="0.35" d="M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-6.5-13.5-3.5-16 4V27v-3.5c-3.5-7.5-13-10.5-16-4-3 6 5 10 5 10z"/>
      <path d="M11.5 30c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0"/>
    </g>
  </g>

  <!-- Cburnett white king (origin) -->
  <g transform="translate(149.5 51) scale(1.0)">
    <g fill="none" fill-rule="evenodd" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <path stroke-linejoin="miter" d="M22.5 11.63V6M20 8h5"/>
      <path fill="#fff" stroke-linecap="butt" stroke-linejoin="miter" d="M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5"/>
      <path fill="#fff" d="M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-6.5-13.5-3.5-16 4V27v-3.5c-3.5-7.5-13-10.5-16-4-3 6 5 10 5 10z"/>
      <path d="M11.5 30c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0"/>
    </g>
  </g>
</svg>
