<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Fog</title>
  <desc id="desc">A piece that just moved cannot capture on the following turn.</desc>
  <!--
    Pieces: Colin M.L. Burnett (Cburnett) chess set
    Licensed under GPL / BSD / GFDL (Wikipedia / Lichess).
  -->

  <rect width="240" height="240" fill="#0a0a0a"/>

  <!-- Board squares -->
  <g stroke="#1e2a24" stroke-width="1">
    <rect x="48" y="140" width="44" height="44" fill="#121816"/>
    <rect x="98" y="96" width="44" height="44" fill="#1a2420"/>
    <rect x="148" y="52" width="44" height="44" fill="#121816"/>
  </g>

  <!-- Just-moved square (fogged) -->
  <rect x="98" y="96" width="44" height="44" fill="#6a7a88" fill-opacity="0.28" stroke="#9eb0ba" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- Enemy target -->
  <rect x="148" y="52" width="44" height="44" fill="#e85d4c" fill-opacity="0.14"/>

  <defs>
    <marker id="fog-move" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#d6a83a"/>
    </marker>
  </defs>

  <!-- Last move into the fogged square -->
  <path d="M70 162 L120 118" fill="none" stroke="#d6a83a" stroke-width="2.75" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#fog-move)"/>

  <!-- Blocked capture attempt -->
  <path d="M120 118 L170 74" fill="none" stroke="#e85d4c" stroke-opacity="0.55" stroke-width="2.75" stroke-linecap="round" stroke-dasharray="4 5"/>
  <g stroke="#e85d4c" stroke-width="3" stroke-linecap="round">
    <path d="M158 62 L182 86"/>
    <path d="M182 62 L158 86"/>
  </g>

  <!-- Fog clouds around the just-moved piece -->
  <g fill="#9eb0ba" fill-opacity="0.22">
    <ellipse cx="100" cy="100" rx="22" ry="12"/>
    <ellipse cx="128" cy="92" rx="26" ry="14"/>
    <ellipse cx="112" cy="118" rx="24" ry="13"/>
    <ellipse cx="140" cy="112" rx="18" ry="10"/>
  </g>
  <g fill="#c8d0cc" fill-opacity="0.18">
    <ellipse cx="90" cy="88" rx="14" ry="8"/>
    <ellipse cx="148" cy="100" rx="16" ry="9"/>
  </g>

  <!-- Enemy pawn (cannot be captured this turn) -->
  <g transform="translate(149.5 55) scale(1.0)" opacity="0.75">
    <path fill="#2a3030" stroke="#c8d0cc" stroke-linecap="round" stroke-width="1.5" d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z"/>
  </g>

  <!-- Just-moved knight, half in fog -->
  <g transform="translate(99.5 99) scale(1.0)" opacity="0.85">
    <g fill="none" fill-rule="evenodd" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <path fill="#fff" d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/>
      <path fill="#fff" d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3"/>
      <path fill="#000" d="M9.5 25.5a.5.5 0 1 1-1 0 .5.5 0 1 1 1 0m5.433-9.75a.5 1.5 30 1 1-.866-.5.5 1.5 30 1 1 .866.5"/>
    </g>
  </g>
</svg>
