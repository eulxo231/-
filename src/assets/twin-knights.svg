<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Twin Knights</title>
  <desc id="desc">After one knight moves, the other knight may make a quiet knight-hop.</desc>
  <!--
    Pieces: Colin M.L. Burnett (Cburnett) chess set
    Licensed under GPL / BSD / GFDL (Wikipedia / Lichess).
  -->

  <rect width="240" height="240" fill="#0a0a0a"/>

  <!-- Board grid -->
  <g stroke="#1e2a24" stroke-width="1">
    <rect x="40" y="140" width="40" height="40" fill="#121816"/>
    <rect x="80" y="140" width="40" height="40" fill="#1a2420"/>
    <rect x="120" y="140" width="40" height="40" fill="#121816"/>
    <rect x="40" y="100" width="40" height="40" fill="#1a2420"/>
    <rect x="80" y="100" width="40" height="40" fill="#121816"/>
    <rect x="120" y="100" width="40" height="40" fill="#1a2420"/>
    <rect x="160" y="100" width="40" height="40" fill="#121816"/>
    <rect x="80" y="60" width="40" height="40" fill="#1a2420"/>
    <rect x="120" y="60" width="40" height="40" fill="#121816"/>
    <rect x="160" y="60" width="40" height="40" fill="#1a2420"/>
  </g>

  <!-- First knight landing (gold) -->
  <rect x="120" y="100" width="40" height="40" fill="#d6a83a" fill-opacity="0.22"/>

  <!-- Twin quiet-hop landing (green) -->
  <rect x="160" y="60" width="40" height="40" fill="#2a8c62" fill-opacity="0.32"/>

  <defs>
    <marker id="tk-gold" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#d6a83a"/>
    </marker>
    <marker id="tk-green" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#3ecf8e"/>
    </marker>
  </defs>

  <!-- Twin bond between the two knights -->
  <path d="M60 160 Q 80 130 100 120" fill="none" stroke="#9eb0ba" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="80" cy="138" r="3" fill="#9eb0ba" fill-opacity="0.55"/>

  <!-- Knight A: L-move (40,140) -> (120,100) -->
  <path d="M60 160 L60 120 L140 120" fill="none" stroke="#d6a83a" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#tk-gold)"/>

  <!-- Knight B: quiet hop (80,100) -> (160,60) -->
  <path d="M100 120 L100 80 L180 80" fill="none" stroke="#3ecf8e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tk-green)"/>

  <!-- Ghost knight A at gold landing -->
  <g opacity="0.35" transform="translate(117.5 95) scale(1.0)">
    <g fill="none" fill-rule="evenodd" stroke="#d6a83a" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <path fill="#d6a83a" fill-opacity="0.35" d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/>
      <path fill="#d6a83a" fill-opacity="0.35" d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3"/>
      <path fill="#000" d="M9.5 25.5a.5.5 0 1 1-1 0 .5.5 0 1 1 1 0m5.433-9.75a.5 1.5 30 1 1-.866-.5.5 1.5 30 1 1 .866.5"/>
    </g>
  </g>

  <!-- Ghost knight B at green landing -->
  <g opacity="0.3" transform="translate(157.5 55) scale(1.0)">
    <g fill="none" fill-rule="evenodd" stroke="#3ecf8e" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <path fill="#3ecf8e" fill-opacity="0.35" d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/>
      <path fill="#3ecf8e" fill-opacity="0.35" d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3"/>
      <path fill="#000" d="M9.5 25.5a.5.5 0 1 1-1 0 .5.5 0 1 1 1 0m5.433-9.75a.5 1.5 30 1 1-.866-.5.5 1.5 30 1 1 .866.5"/>
    </g>
  </g>

  <!-- Knight A (solid) -->
  <g transform="translate(37.5 135) scale(1.0)">
    <g fill="none" fill-rule="evenodd" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <path fill="#fff" d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/>
      <path fill="#fff" d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3"/>
      <path fill="#000" d="M9.5 25.5a.5.5 0 1 1-1 0 .5.5 0 1 1 1 0m5.433-9.75a.5 1.5 30 1 1-.866-.5.5 1.5 30 1 1 .866.5"/>
    </g>
  </g>

  <!-- Knight B / twin (solid) -->
  <g transform="translate(77.5 95) scale(1.0)">
    <g fill="none" fill-rule="evenodd" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <path fill="#fff" d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/>
      <path fill="#fff" d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3"/>
      <path fill="#000" d="M9.5 25.5a.5.5 0 1 1-1 0 .5.5 0 1 1 1 0m5.433-9.75a.5 1.5 30 1 1-.866-.5.5 1.5 30 1 1 .866.5"/>
    </g>
  </g>
</svg>
