<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Rewind</title>
  <desc id="desc">The last move is undone; the piece returns to where it came from.</desc>
  <!--
    Pieces: Colin M.L. Burnett (Cburnett) chess set
    Licensed under GPL / BSD / GFDL (Wikipedia / Lichess).
  -->

  <rect width="240" height="240" fill="#0a0a0a"/>

  <!-- Board squares along the undone move -->
  <g stroke="#1e2a24" stroke-width="1">
    <rect x="40" y="140" width="48" height="48" fill="#121816"/>
    <rect x="88" y="96" width="48" height="48" fill="#1a2420"/>
    <rect x="136" y="52" width="48" height="48" fill="#121816"/>
  </g>

  <!-- Origin (restored) -->
  <rect x="40" y="140" width="48" height="48" fill="#2a8c62" fill-opacity="0.3" stroke="#3ecf8e" stroke-opacity="0.55" stroke-width="1.75"/>

  <!-- Undone landing square -->
  <rect x="136" y="52" width="48" height="48" fill="#d6a83a" fill-opacity="0.16"/>

  <defs>
    <marker id="rw-gold" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#d6a83a"/>
    </marker>
    <marker id="rw-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3ecf8e"/>
    </marker>
  </defs>

  <!-- Faded last-move path (what is being undone) -->
  <path d="M64 164 L160 76" fill="none" stroke="#d6a83a" stroke-opacity="0.4" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#rw-gold)"/>

  <!-- Rewind arc back to origin -->
  <path d="M160 76 C 200 120, 120 160, 64 164" fill="none" stroke="#3ecf8e" stroke-width="3.25" stroke-linecap="round" marker-end="url(#rw-green)"/>

  <!-- Rewind chevrons -->
  <g fill="none" stroke="#3ecf8e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M188 128 L172 112 L188 96"/>
    <path d="M204 128 L188 112 L204 96"/>
  </g>

  <!-- Ghost piece at undone destination -->
  <g opacity="0.28" transform="translate(137.5 55) scale(1.0)">
    <g fill="none" fill-rule="evenodd" stroke="#d6a83a" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <path fill="#d6a83a" fill-opacity="0.35" d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/>
      <path fill="#d6a83a" fill-opacity="0.35" d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3"/>
      <path fill="#000" d="M9.5 25.5a.5.5 0 1 1-1 0 .5.5 0 1 1 1 0m5.433-9.75a.5 1.5 30 1 1-.866-.5.5 1.5 30 1 1 .866.5"/>
    </g>
  </g>

  <!-- Piece restored at origin -->
  <g transform="translate(41.5 143) scale(1.0)">
    <g fill="none" fill-rule="evenodd" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <path fill="#fff" d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/>
      <path fill="#fff" d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3"/>
      <path fill="#000" d="M9.5 25.5a.5.5 0 1 1-1 0 .5.5 0 1 1 1 0m5.433-9.75a.5 1.5 30 1 1-.866-.5.5 1.5 30 1 1 .866.5"/>
    </g>
  </g>
</svg>
