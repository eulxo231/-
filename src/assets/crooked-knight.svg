<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Crooked Knight</title>
  <desc id="desc">After a knight leap, that knight may take one extra non-capturing king-step.</desc>
  <!--
    Pieces: Colin M.L. Burnett (Cburnett) chess set
    Licensed under GPL / BSD / GFDL (Wikipedia / Lichess).
  -->

  <rect width="240" height="240" fill="#0a0a0a"/>

  <!-- Board cells -->
  <g stroke="#1e2a24" stroke-width="1">
    <rect x="48" y="144" width="40" height="40" fill="#121816"/>
    <rect x="88" y="144" width="40" height="40" fill="#1a2420"/>
    <rect x="128" y="144" width="40" height="40" fill="#121816"/>
    <rect x="48" y="104" width="40" height="40" fill="#1a2420"/>
    <rect x="88" y="104" width="40" height="40" fill="#121816"/>
    <rect x="128" y="104" width="40" height="40" fill="#1a2420"/>
    <rect x="48" y="64" width="40" height="40" fill="#121816"/>
    <rect x="88" y="64" width="40" height="40" fill="#1a2420"/>
    <rect x="128" y="64" width="40" height="40" fill="#121816"/>
    <rect x="168" y="64" width="40" height="40" fill="#1a2420"/>
  </g>

  <!-- Knight-leap landing (gold) -->
  <rect x="128" y="64" width="40" height="40" fill="#d6a83a" fill-opacity="0.22"/>

  <!-- Extra king-step options from landing (green) -->
  <g fill="#2a8c62" fill-opacity="0.3">
    <rect x="168" y="64" width="40" height="40"/>
    <rect x="128" y="104" width="40" height="40"/>
    <rect x="88" y="64" width="40" height="40"/>
  </g>

  <defs>
    <marker id="ck-gold" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#d6a83a"/>
    </marker>
    <marker id="ck-green" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#3ecf8e"/>
    </marker>
  </defs>

  <!-- 1) Knight L-move: from (68,164) center of start cell 48+20,144+20 to (148,84) -->
  <g fill="none" stroke="#d6a83a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#ck-gold)">
    <path d="M68 164 L68 84 L148 84"/>
  </g>
  <!-- 2) Extra king-step (quiet) from landing -->
  <g fill="none" stroke="#3ecf8e" stroke-width="3" stroke-linecap="round" marker-end="url(#ck-green)">
    <path d="M148 84 L188 84"/>
  </g>

  <!-- Ghost knight at leap landing -->
  <g opacity="0.35" transform="translate(125.5 59) scale(1.0)">
    <g fill="none" fill-rule="evenodd" stroke="#d6a83a" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <path fill="#d6a83a" fill-opacity="0.35" d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/>
      <path fill="#d6a83a" fill-opacity="0.35" d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3"/>
      <path fill="#000" d="M9.5 25.5a.5.5 0 1 1-1 0 .5.5 0 1 1 1 0m5.433-9.75a.5 1.5 30 1 1-.866-.5.5 1.5 30 1 1 .866.5"/>
    </g>
  </g>

  <!-- Ghost knight after king-step -->
  <g opacity="0.28" transform="translate(165.5 59) scale(1.0)">
    <g fill="none" fill-rule="evenodd" stroke="#3ecf8e" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <path fill="#3ecf8e" fill-opacity="0.35" d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/>
      <path fill="#3ecf8e" fill-opacity="0.35" d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3"/>
      <path fill="#000" d="M9.5 25.5a.5.5 0 1 1-1 0 .5.5 0 1 1 1 0m5.433-9.75a.5 1.5 30 1 1-.866-.5.5 1.5 30 1 1 .866.5"/>
    </g>
  </g>

  <!-- Cburnett white knight (start) -->
  <g transform="translate(45.5 139) scale(1.0)">
    <g fill="none" fill-rule="evenodd" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <path fill="#fff" d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/>
      <path fill="#fff" d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3"/>
      <path fill="#000" d="M9.5 25.5a.5.5 0 1 1-1 0 .5.5 0 1 1 1 0m5.433-9.75a.5 1.5 30 1 1-.866-.5.5 1.5 30 1 1 .866.5"/>
    </g>
  </g>

</svg>
