<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Poltergeist</title>
  <desc id="desc">An enemy piece is forced one quiet step by a spectral push.</desc>
  <!--
    Pieces: Colin M.L. Burnett (Cburnett) chess set
    Licensed under GPL / BSD / GFDL (Wikipedia / Lichess).
  -->

  <rect width="240" height="240" fill="#0a0a0a"/>

  <!-- Board squares -->
  <g stroke="#1e2a24" stroke-width="1">
    <rect x="72" y="108" width="48" height="48" fill="#121816"/>
    <rect x="120" y="108" width="48" height="48" fill="#1a2420"/>
  </g>

  <!-- Forced quiet destination -->
  <rect x="120" y="108" width="48" height="48" fill="#7ec8ff" fill-opacity="0.18" stroke="#7ec8ff" stroke-opacity="0.55" stroke-width="1.75" stroke-dasharray="4 3"/>

  <!-- Origin (leaving) -->
  <rect x="72" y="108" width="48" height="48" fill="#4a6a8a" fill-opacity="0.2"/>

  <defs>
    <marker id="pg-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7ec8ff"/>
    </marker>
  </defs>

  <!-- Spectral push trail -->
  <path d="M96 132 L144 132" fill="none" stroke="#7ec8ff" stroke-opacity="0.25" stroke-width="14" stroke-linecap="round"/>
  <path d="M88 132 L148 132" fill="none" stroke="#7ec8ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#pg-arrow)"/>

  <!-- Ghost wisps (poltergeist force) -->
  <g fill="none" stroke="#7ec8ff" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round">
    <path d="M52 100 C 60 88, 70 92, 68 108"/>
    <path d="M44 132 C 56 124, 58 140, 50 148"/>
    <path d="M56 164 C 66 156, 74 168, 64 176"/>
  </g>
  <g fill="#7ec8ff" fill-opacity="0.7">
    <circle cx="68" cy="108" r="2"/>
    <circle cx="50" cy="148" r="2"/>
    <circle cx="64" cy="176" r="2"/>
  </g>

  <!-- Ghost piece at destination -->
  <g opacity="0.32" transform="translate(121.5 111) scale(1.0)">
    <g fill="none" fill-rule="evenodd" stroke="#7ec8ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <path fill="#7ec8ff" fill-opacity="0.35" d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/>
      <path fill="#7ec8ff" fill-opacity="0.35" d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3"/>
      <path fill="#0a0a0a" d="M9.5 25.5a.5.5 0 1 1-1 0 .5.5 0 1 1 1 0m5.433-9.75a.5 1.5 30 1 1-.866-.5.5 1.5 30 1 1 .866.5"/>
    </g>
  </g>

  <!-- Enemy knight being forced -->
  <g transform="translate(73.5 111) scale(1.0)" opacity="0.8">
    <g fill="none" fill-rule="evenodd" stroke="#c8d0cc" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <path fill="#2a3030" d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/>
      <path fill="#2a3030" d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3"/>
      <path fill="#7ec8ff" d="M9.5 25.5a.5.5 0 1 1-1 0 .5.5 0 1 1 1 0m5.433-9.75a.5 1.5 30 1 1-.866-.5.5 1.5 30 1 1 .866.5"/>
    </g>
  </g>
</svg>
