<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Knightmare</title>
  <desc id="desc">Cburnett Staunton white knight with green one-square orthogonal moves and gold knight-leap marks.</desc>
  <!--
    Knight piece: Colin M.L. Burnett (Cburnett) chess set
    Licensed under GPL / BSD / GFDL (same asset family as Wikipedia and Lichess).
    Chess.com Neo pieces are proprietary and are not used here.
  -->

  <rect width="240" height="240" fill="#0a0a0a"/>

  <!-- Soft board hint -->
  <g fill="none" stroke="#1e2a24" stroke-width="1.25">
    <rect x="48" y="48" width="48" height="48"/>
    <rect x="96" y="48" width="48" height="48"/>
    <rect x="144" y="48" width="48" height="48"/>
    <rect x="48" y="96" width="48" height="48"/>
    <rect x="96" y="96" width="48" height="48"/>
    <rect x="144" y="96" width="48" height="48"/>
    <rect x="48" y="144" width="48" height="48"/>
    <rect x="96" y="144" width="48" height="48"/>
    <rect x="144" y="144" width="48" height="48"/>
  </g>

  <!-- Sample knight-leap targets (gold) -->
  <g fill="#d6a83a" fill-opacity="0.18">
    <circle cx="168" cy="48" r="12"/>
    <circle cx="192" cy="72" r="12"/>
    <circle cx="72" cy="192" r="12"/>
    <circle cx="48" cy="168" r="12"/>
  </g>
  <g fill="none" stroke="#d6a83a" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round">
    <path d="M120 120 L120 48 L168 48"/>
    <path d="M120 120 L192 120 L192 72"/>
    <path d="M120 120 L120 192 L72 192"/>
    <path d="M120 120 L48 120 L48 168"/>
  </g>
  <g fill="#d6a83a">
    <circle cx="168" cy="48" r="3.5"/>
    <circle cx="192" cy="72" r="3.5"/>
    <circle cx="72" cy="192" r="3.5"/>
    <circle cx="48" cy="168" r="3.5"/>
  </g>

  <!-- Orthogonal one-square bonus (green) -->
  <g fill="#2a8c62" fill-opacity="0.28">
    <rect x="96" y="48" width="48" height="48"/>
    <rect x="96" y="144" width="48" height="48"/>
    <rect x="48" y="96" width="48" height="48"/>
    <rect x="144" y="96" width="48" height="48"/>
  </g>

  <defs>
    <marker id="km-arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#3ecf8e"/>
    </marker>
  </defs>
  <g stroke="#3ecf8e" stroke-width="3.5" stroke-linecap="round" fill="none" marker-end="url(#km-arrow)">
    <path d="M120 96 L120 72"/>
    <path d="M120 152 L120 168"/>
    <path d="M96 120 L72 120"/>
    <path d="M144 120 L168 120"/>
  </g>
  <g fill="#3ecf8e">
    <circle cx="120" cy="72" r="3"/>
    <circle cx="120" cy="168" r="3"/>
    <circle cx="72" cy="120" r="3"/>
    <circle cx="168" cy="120" r="3"/>
  </g>

  <!-- Cburnett white knight (viewBox 0 0 45 45), centered -->
  <g transform="translate(71.25 58) scale(2.15)">
    <g fill="none" fill-rule="evenodd" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <path fill="#fff" d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/>
      <path fill="#fff" d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3"/>
      <path fill="#000" d="M9.5 25.5a.5.5 0 1 1-1 0 .5.5 0 1 1 1 0m5.433-9.75a.5 1.5 30 1 1-.866-.5.5 1.5 30 1 1 .866.5"/>
    </g>
  </g>
</svg>
