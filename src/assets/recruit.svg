<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Recruit</title>
  <desc id="desc">A pawn is placed on an empty square of the second rank.</desc>
  <!--
    Pieces: Colin M.L. Burnett (Cburnett) chess set
    Licensed under GPL / BSD / GFDL (Wikipedia / Lichess).
  -->

  <rect width="240" height="240" fill="#0a0a0a"/>

  <!-- Back rank + second rank -->
  <g stroke="#1e2a24" stroke-width="1">
    <rect x="40" y="148" width="40" height="40" fill="#121816"/>
    <rect x="80" y="148" width="40" height="40" fill="#1a2420"/>
    <rect x="120" y="148" width="40" height="40" fill="#121816"/>
    <rect x="160" y="148" width="40" height="40" fill="#1a2420"/>
    <rect x="40" y="108" width="40" height="40" fill="#1a2420"/>
    <rect x="80" y="108" width="40" height="40" fill="#121816"/>
    <rect x="120" y="108" width="40" height="40" fill="#1a2420"/>
    <rect x="160" y="108" width="40" height="40" fill="#121816"/>
  </g>

  <!-- Second-rank zone -->
  <rect x="40" y="108" width="160" height="40" fill="#2a8c62" fill-opacity="0.12" stroke="#3ecf8e" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Empty drop square -->
  <rect x="120" y="108" width="40" height="40" fill="#2a8c62" fill-opacity="0.32"/>

  <!-- Friendly pawns already on the rank (context) -->
  <g transform="translate(41.5 111) scale(0.9)" opacity="0.45">
    <path fill="#fff" stroke="#000" stroke-linecap="round" stroke-width="1.5" d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z"/>
  </g>
  <g transform="translate(161.5 111) scale(0.9)" opacity="0.45">
    <path fill="#fff" stroke="#000" stroke-linecap="round" stroke-width="1.5" d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z"/>
  </g>

  <defs>
    <marker id="rc-drop" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3ecf8e"/>
    </marker>
  </defs>

  <!-- Drop-in arrow -->
  <path d="M140 56 L140 112" fill="none" stroke="#3ecf8e" stroke-width="3.25" stroke-linecap="round" marker-end="url(#rc-drop)"/>

  <!-- Recruit sparkles -->
  <g fill="#3ecf8e">
    <circle cx="118" cy="70" r="2.5"/>
    <circle cx="162" cy="78" r="2"/>
    <circle cx="128" cy="96" r="2"/>
  </g>
  <g stroke="#3ecf8e" stroke-width="1.75" stroke-linecap="round" fill="none">
    <path d="M156 60 L156 52 M152 56 L160 56"/>
    <path d="M124 88 L124 82 M121 85 L127 85"/>
  </g>

  <!-- Newly recruited pawn -->
  <g transform="translate(117.5 111) scale(1.0)">
    <path fill="#fff" stroke="#000" stroke-linecap="round" stroke-width="1.5" d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z"/>
  </g>
</svg>
