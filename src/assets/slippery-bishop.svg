<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Slippery Bishop</title>
  <desc id="desc">A bishop slides diagonally through one friendly piece to a square beyond.</desc>
  <!--
    Pieces: Colin M.L. Burnett (Cburnett) chess set
    Licensed under GPL / BSD / GFDL (Wikipedia / Lichess).
  -->

  <rect width="240" height="240" fill="#0a0a0a"/>

  <!-- Diagonal board squares (a1-style dark/light along / diagonal) -->
  <g stroke="#1e2a24" stroke-width="1">
    <rect x="28" y="156" width="40" height="40" fill="#121816"/>
    <rect x="68" y="116" width="40" height="40" fill="#1a2420"/>
    <rect x="108" y="76" width="40" height="40" fill="#121816"/>
    <rect x="148" y="36" width="40" height="40" fill="#1a2420"/>
  </g>

  <!-- Path glow along the diagonal -->
  <path d="M48 176 L168 56" stroke="#2a8c62" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- Friendly piece square (pass-through) -->
  <rect x="68" y="116" width="40" height="40" fill="#d6a83a" fill-opacity="0.22" stroke="#d6a83a" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Destination beyond -->
  <rect x="148" y="36" width="40" height="40" fill="#2a8c62" fill-opacity="0.35"/>

  <!-- Slide arrow through friendly piece -->
  <defs>
    <marker id="sb-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3ecf8e"/>
    </marker>
  </defs>
  <path d="M52 172 L160 64" stroke="#3ecf8e" stroke-width="3.5" stroke-linecap="round" fill="none" marker-end="url(#sb-arrow)"/>

  <!-- Ghost destination bishop -->
  <g opacity="0.3" transform="translate(145.5 31) scale(1.0)">
    <g fill="none" fill-rule="evenodd" stroke="#3ecf8e" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <g fill="#3ecf8e" fill-opacity="0.4" stroke-linecap="butt">
        <path d="M9 36c3.39-.97 10.11.43 13.5-2 3.39 2.43 10.11 1.03 13.5 2 0 0 1.65.54 3 2-.68.97-1.65.99-3 .5-3.39-.97-10.11.46-13.5-1-3.39 1.46-10.11.03-13.5 1-1.35.49-2.32.47-3-.5 1.35-1.94 3-2 3-2z"/>
        <path d="M15 32c2.5 2.5 12.5 2.5 15 0 .5-1.5 0-2 0-2 0-2.5-2.5-4-2.5-4 5.5-1.5 6-11.5-5-15.5-11 4-10.5 14-5 15.5 0 0-2.5 1.5-2.5 4 0 0-.5.5 0 2z"/>
        <path d="M25 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 1 1 5 0z"/>
      </g>
      <path stroke-linejoin="miter" d="M17.5 26h10M15 30h15m-7.5-14.5v5M20 18h5"/>
    </g>
  </g>

  <!-- Cburnett white bishop (start of diagonal) -->
  <g transform="translate(25.5 151) scale(1.0)">
    <g fill="none" fill-rule="evenodd" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <g fill="#fff" stroke-linecap="butt">
        <path d="M9 36c3.39-.97 10.11.43 13.5-2 3.39 2.43 10.11 1.03 13.5 2 0 0 1.65.54 3 2-.68.97-1.65.99-3 .5-3.39-.97-10.11.46-13.5-1-3.39 1.46-10.11.03-13.5 1-1.35.49-2.32.47-3-.5 1.35-1.94 3-2 3-2z"/>
        <path d="M15 32c2.5 2.5 12.5 2.5 15 0 .5-1.5 0-2 0-2 0-2.5-2.5-4-2.5-4 5.5-1.5 6-11.5-5-15.5-11 4-10.5 14-5 15.5 0 0-2.5 1.5-2.5 4 0 0-.5.5 0 2z"/>
        <path d="M25 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 1 1 5 0z"/>
      </g>
      <path stroke-linejoin="miter" d="M17.5 26h10M15 30h15m-7.5-14.5v5M20 18h5"/>
    </g>
  </g>

  <!-- Friendly Cburnett pawn (passed through) -->
  <g transform="translate(65.5 111) scale(1.0)">
    <path fill="#fff" stroke="#000" stroke-linecap="round" stroke-width="1.5" d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z"/>
  </g>

  <!-- Pass-through badge -->
  <g transform="translate(88 136)">
    <circle cx="0" cy="0" r="9" fill="#0a0a0a" stroke="#d6a83a" stroke-width="1.5"/>
    <path d="M-4 0 L-1 3 L5 -4" fill="none" stroke="#d6a83a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

</svg>
