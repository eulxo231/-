<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Crown Split</title>
  <desc id="desc">A queen is replaced by two knights on her square and an adjacent square.</desc>
  <!--
    Queen: fixed Staunton card-art silhouette (see piece-queen.svg).
    Knights: Colin M.L. Burnett (Cburnett), GPL / BSD / GFDL.
  -->

  <rect width="240" height="240" fill="#0a0a0a"/>

  <!-- Adjacent squares -->
  <g stroke="#1e2a24" stroke-width="1">
    <rect x="72" y="96" width="48" height="48" fill="#121816"/>
    <rect x="120" y="96" width="48" height="48" fill="#1a2420"/>
  </g>

  <!-- Split destinations -->
  <g fill="#2a8c62" fill-opacity="0.28" stroke="#3ecf8e" stroke-opacity="0.5" stroke-width="1.5">
    <rect x="72" y="96" width="48" height="48"/>
    <rect x="120" y="96" width="48" height="48"/>
  </g>

  <!-- Faded queen source (fixed Staunton style) -->
  <g transform="translate(120 58) scale(0.15)" opacity="0.35">
    <path fill="#d6a83a" stroke="#d6a83a" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" d="M-54 46C-54 38 -48 34 -42 34L-48 14L-34 34L-26 2L-14 34L0 -6L14 34L26 2L34 34L48 14L42 34C48 34 54 38 54 46L52 58C44 66 34 68 28 68L24 68C18 80 18 96 18 112L18 128C18 140 28 146 40 150L52 154C62 158 64 166 64 174L64 182C64 194 50 200 36 200L-36 200C-50 200 -64 194 -64 182L-64 174C-64 166 -62 158 -52 154L-40 150C-28 146 -18 140 -18 128L-18 112C-18 96 -18 80 -24 68L-28 68C-34 68 -44 66 -52 58Z"/>
    <g fill="#d6a83a" stroke="#d6a83a" stroke-width="8">
      <circle cx="-48" cy="10" r="7.5"/>
      <circle cx="-26" cy="-2" r="7.5"/>
      <circle cx="0" cy="-10" r="8"/>
      <circle cx="26" cy="-2" r="7.5"/>
      <circle cx="48" cy="10" r="7.5"/>
    </g>
    <path d="M-42 58 L42 58" fill="none" stroke="#d6a83a" stroke-width="8" stroke-linecap="round"/>
    <path d="M-16 108 L16 108" fill="none" stroke="#d6a83a" stroke-width="7" stroke-linecap="round"/>
    <path d="M-18 124 L18 124" fill="none" stroke="#d6a83a" stroke-width="7" stroke-linecap="round"/>
    <path d="M-50 152 L50 152" fill="none" stroke="#d6a83a" stroke-width="7.5" stroke-linecap="round"/>
  </g>

  <defs>
    <marker id="cs-arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#3ecf8e"/>
    </marker>
  </defs>

  <!-- Split rays from queen center into two knights -->
  <g fill="none" stroke="#3ecf8e" stroke-width="2.75" stroke-linecap="round" marker-end="url(#cs-arrow)">
    <path d="M108 88 L96 108"/>
    <path d="M132 88 L144 108"/>
  </g>

  <!-- Result: knight on queen's square -->
  <g transform="translate(73.5 99) scale(1.0)">
    <g fill="none" fill-rule="evenodd" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <path fill="#fff" d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/>
      <path fill="#fff" d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3"/>
      <path fill="#000" d="M9.5 25.5a.5.5 0 1 1-1 0 .5.5 0 1 1 1 0m5.433-9.75a.5 1.5 30 1 1-.866-.5.5 1.5 30 1 1 .866.5"/>
    </g>
  </g>

  <!-- Result: second knight on adjacent square -->
  <g transform="translate(121.5 99) scale(1.0)">
    <g fill="none" fill-rule="evenodd" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <path fill="#fff" d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/>
      <path fill="#fff" d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3"/>
      <path fill="#000" d="M9.5 25.5a.5.5 0 1 1-1 0 .5.5 0 1 1 1 0m5.433-9.75a.5 1.5 30 1 1-.866-.5.5 1.5 30 1 1 .866.5"/>
    </g>
  </g>
</svg>
