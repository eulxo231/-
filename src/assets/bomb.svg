<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Bomb</title>
  <desc id="desc">An enemy non-king piece is removed from the board.</desc>
  <!--
    Pieces: Colin M.L. Burnett (Cburnett) chess set
    Licensed under GPL / BSD / GFDL (Wikipedia / Lichess).
  -->

  <rect width="240" height="240" fill="#0a0a0a"/>

  <!-- Soft board hint -->
  <g fill="none" stroke="#1e2a24" stroke-width="1.25">
    <rect x="72" y="72" width="96" height="96"/>
  </g>

  <!-- Target square -->
  <rect x="96" y="96" width="48" height="48" fill="#e85d4c" fill-opacity="0.28" stroke="#e85d4c" stroke-opacity="0.7" stroke-width="2"/>

  <!-- Explosion burst -->
  <g stroke="#e85d4c" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M120 88 L120 56"/>
    <path d="M120 152 L120 184"/>
    <path d="M88 120 L56 120"/>
    <path d="M152 120 L184 120"/>
    <path d="M98 98 L74 74"/>
    <path d="M142 98 L166 74"/>
    <path d="M98 142 L74 166"/>
    <path d="M142 142 L166 166"/>
  </g>
  <g fill="#e85d4c">
    <circle cx="120" cy="56" r="3"/>
    <circle cx="120" cy="184" r="3"/>
    <circle cx="56" cy="120" r="3"/>
    <circle cx="184" cy="120" r="3"/>
    <circle cx="74" cy="74" r="2.5"/>
    <circle cx="166" cy="74" r="2.5"/>
    <circle cx="74" cy="166" r="2.5"/>
    <circle cx="166" cy="166" r="2.5"/>
  </g>

  <!-- Blast shards -->
  <g fill="#e85d4c" fill-opacity="0.85">
    <polygon points="148,70 160,62 156,78"/>
    <polygon points="170,108 186,104 176,120"/>
    <polygon points="148,168 162,176 152,182"/>
    <polygon points="70,108 54,100 62,120"/>
    <polygon points="92,68 84,54 100,60"/>
  </g>

  <!-- Enemy piece being removed (dark rook), fading -->
  <g transform="translate(97.5 99) scale(1.0)" opacity="0.55">
    <g fill="#2a3030" fill-rule="evenodd" stroke="#c8d0cc" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <path stroke-linecap="butt" d="M9 39h27v-3H9zm3-3v-4h21v4zm-1-22V9h4v2h5V9h5v2h5V9h4v5"/>
      <path d="m34 14-3 3H14l-3-3"/>
      <path stroke-linecap="butt" stroke-linejoin="miter" d="M31 17v12.5H14V17"/>
      <path d="m31 29.5 1.5 2.5h-20l1.5-2.5"/>
      <path fill="none" stroke-linejoin="miter" d="M11 14h23"/>
    </g>
  </g>
</svg>
