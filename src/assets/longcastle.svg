<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Longcastle</title>
  <desc id="desc">King castling with a rook on the back rank along a clear path.</desc>
  <!--
    Pieces: Colin M.L. Burnett (Cburnett) chess set
    Licensed under GPL / BSD / GFDL (Wikipedia / Lichess).
  -->

  <rect width="240" height="240" fill="#0a0a0a"/>

  <!-- Back-rank board strip (8 files) -->
  <g>
    <!-- ranks suggestion -->
    <g fill="none" stroke="#1e2a24" stroke-width="1">
      <rect x="16" y="96" width="26" height="26"/>
      <rect x="42" y="96" width="26" height="26"/>
      <rect x="68" y="96" width="26" height="26"/>
      <rect x="94" y="96" width="26" height="26"/>
      <rect x="120" y="96" width="26" height="26"/>
      <rect x="146" y="96" width="26" height="26"/>
      <rect x="172" y="96" width="26" height="26"/>
      <rect x="198" y="96" width="26" height="26"/>
    </g>

    <!-- Clear path between rook (a) and king (e): b,c,d highlighted -->
    <g fill="#2a8c62" fill-opacity="0.28">
      <rect x="42" y="96" width="26" height="26"/>
      <rect x="68" y="96" width="26" height="26"/>
      <rect x="94" y="96" width="26" height="26"/>
    </g>

    <!-- Destination squares after castling -->
    <g fill="#3ecf8e" fill-opacity="0.2">
      <!-- king to c -->
      <rect x="68" y="96" width="26" height="26"/>
      <!-- rook to d -->
      <rect x="94" y="96" width="26" height="26"/>
    </g>
  </g>

  <!-- Second example: kingside path clear on f,g -->
  <g fill="#2a8c62" fill-opacity="0.12">
    <rect x="146" y="96" width="26" height="26"/>
    <rect x="172" y="96" width="26" height="26"/>
  </g>

  <!-- Castling motion arrows (queenside) -->
  <defs>
    <marker id="lc-arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#3ecf8e"/>
    </marker>
  </defs>
  <g stroke="#3ecf8e" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#lc-arrow)">
    <!-- king e -> c -->
    <path d="M133 140 L81 140"/>
    <!-- rook a -> d -->
    <path d="M29 78 L107 78"/>
  </g>

  <!-- Ghost destinations (faded pieces where they end up) -->
  <g opacity="0.28">
    <!-- king ghost on c: file center 68+13=81 -->
    <g transform="translate(58.5 88) scale(1.0)">
      <g fill="none" fill-rule="evenodd" stroke="#3ecf8e" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
        <path stroke-linejoin="miter" d="M22.5 11.63V6M20 8h5"/>
        <path fill="#3ecf8e" fill-opacity="0.35" stroke-linecap="butt" stroke-linejoin="miter" d="M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5"/>
        <path fill="#3ecf8e" fill-opacity="0.35" d="M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-6.5-13.5-3.5-16 4V27v-3.5c-3.5-7.5-13-10.5-16-4-3 6 5 10 5 10z"/>
        <path d="M11.5 30c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0"/>
      </g>
    </g>
    <!-- rook ghost on d: 94+13=107 -->
    <g transform="translate(84.5 40) scale(1.0)">
      <g fill="#3ecf8e" fill-opacity="0.35" fill-rule="evenodd" stroke="#3ecf8e" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
        <path stroke-linecap="butt" d="M9 39h27v-3H9zm3-3v-4h21v4zm-1-22V9h4v2h5V9h5v2h5V9h4v5"/>
        <path d="m34 14-3 3H14l-3-3"/>
        <path stroke-linecap="butt" stroke-linejoin="miter" d="M31 17v12.5H14V17"/>
        <path d="m31 29.5 1.5 2.5h-20l1.5-2.5"/>
        <path fill="none" stroke-linejoin="miter" d="M11 14h23"/>
      </g>
    </g>
  </g>

  <!-- Cburnett white rook on a-file (start) -->
  <g transform="translate(6.5 88) scale(1.0)">
    <g fill="#fff" fill-rule="evenodd" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <path stroke-linecap="butt" d="M9 39h27v-3H9zm3-3v-4h21v4zm-1-22V9h4v2h5V9h5v2h5V9h4v5"/>
      <path d="m34 14-3 3H14l-3-3"/>
      <path stroke-linecap="butt" stroke-linejoin="miter" d="M31 17v12.5H14V17"/>
      <path d="m31 29.5 1.5 2.5h-20l1.5-2.5"/>
      <path fill="none" stroke-linejoin="miter" d="M11 14h23"/>
    </g>
  </g>

  <!-- Cburnett white king on e-file (start) -->
  <g transform="translate(110.5 88) scale(1.0)">
    <g fill="none" fill-rule="evenodd" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <path stroke-linejoin="miter" d="M22.5 11.63V6M20 8h5"/>
      <path fill="#fff" stroke-linecap="butt" stroke-linejoin="miter" d="M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5"/>
      <path fill="#fff" d="M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-6.5-13.5-3.5-16 4V27v-3.5c-3.5-7.5-13-10.5-16-4-3 6 5 10 5 10z"/>
      <path d="M11.5 30c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0"/>
    </g>
  </g>

  <!-- Cburnett white rook on h-file (any rook) -->
  <g transform="translate(188.5 88) scale(1.0)">
    <g fill="#fff" fill-rule="evenodd" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <path stroke-linecap="butt" d="M9 39h27v-3H9zm3-3v-4h21v4zm-1-22V9h4v2h5V9h5v2h5V9h4v5"/>
      <path d="m34 14-3 3H14l-3-3"/>
      <path stroke-linecap="butt" stroke-linejoin="miter" d="M31 17v12.5H14V17"/>
      <path d="m31 29.5 1.5 2.5h-20l1.5-2.5"/>
      <path fill="none" stroke-linejoin="miter" d="M11 14h23"/>
    </g>
  </g>

</svg>
