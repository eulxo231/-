<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Mirror</title>
  <desc id="desc">Castling is disabled for both players.</desc>
  <!--
    Pieces: Colin M.L. Burnett (Cburnett) chess set
    Licensed under GPL / BSD / GFDL (Wikipedia / Lichess).
  -->

  <rect width="240" height="240" fill="#0a0a0a"/>

  <!-- Back-rank strip -->
  <g stroke="#1e2a24" stroke-width="1">
    <rect x="36" y="112" width="36" height="36" fill="#121816"/>
    <rect x="72" y="112" width="36" height="36" fill="#1a2420"/>
    <rect x="108" y="112" width="36" height="36" fill="#121816"/>
    <rect x="144" y="112" width="36" height="36" fill="#1a2420"/>
    <rect x="180" y="112" width="36" height="36" fill="#121816"/>
  </g>

  <!-- Blocked castling path -->
  <g fill="#e85d4c" fill-opacity="0.16">
    <rect x="72" y="112" width="36" height="36"/>
    <rect x="144" y="112" width="36" height="36"/>
  </g>

  <!-- Mirror plane down the center -->
  <path d="M120 40 L120 200" fill="none" stroke="#9eb0ba" stroke-opacity="0.55" stroke-width="2.5" stroke-dasharray="6 5"/>
  <g fill="none" stroke="#c8d0cc" stroke-opacity="0.4" stroke-width="1.5">
    <path d="M108 56 L120 40 L132 56"/>
    <path d="M108 184 L120 200 L132 184"/>
  </g>

  <!-- Reflection sheen -->
  <rect x="124" y="48" width="8" height="144" fill="#c8d0cc" fill-opacity="0.08"/>

  <!-- Blocked castling arrows -->
  <g stroke="#e85d4c" stroke-opacity="0.65" stroke-width="2.75" stroke-linecap="round" stroke-dasharray="5 4" fill="none">
    <path d="M54 160 L162 160"/>
    <path d="M198 96 L90 96"/>
  </g>

  <!-- X marks: castling forbidden -->
  <g stroke="#e85d4c" stroke-width="3" stroke-linecap="round">
    <path d="M108 96 L132 120"/>
    <path d="M132 96 L108 120"/>
    <path d="M108 148 L132 172"/>
    <path d="M132 148 L108 172"/>
  </g>

  <!-- King on e -->
  <g transform="translate(103.5 104) scale(1.0)">
    <g fill="none" fill-rule="evenodd" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <path stroke-linejoin="miter" d="M22.5 11.63V6M20 8h5"/>
      <path fill="#fff" stroke-linecap="butt" stroke-linejoin="miter" d="M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5"/>
      <path fill="#fff" d="M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-6.5-13.5-3.5-16 4V27v-3.5c-3.5-7.5-13-10.5-16-4-3 6 5 10 5 10z"/>
      <path d="M11.5 30c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0"/>
    </g>
  </g>

  <!-- Rook on a (left of mirror) -->
  <g transform="translate(31.5 104) scale(1.0)">
    <g fill="#fff" fill-rule="evenodd" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <path stroke-linecap="butt" d="M9 39h27v-3H9zm3-3v-4h21v4zm-1-22V9h4v2h5V9h5v2h5V9h4v5"/>
      <path d="m34 14-3 3H14l-3-3"/>
      <path stroke-linecap="butt" stroke-linejoin="miter" d="M31 17v12.5H14V17"/>
      <path d="m31 29.5 1.5 2.5h-20l1.5-2.5"/>
      <path fill="none" stroke-linejoin="miter" d="M11 14h23"/>
    </g>
  </g>

  <!-- Rook on h (right of mirror) -->
  <g transform="translate(175.5 104) scale(1.0)">
    <g fill="#fff" fill-rule="evenodd" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <path stroke-linecap="butt" d="M9 39h27v-3H9zm3-3v-4h21v4zm-1-22V9h4v2h5V9h5v2h5V9h4v5"/>
      <path d="m34 14-3 3H14l-3-3"/>
      <path stroke-linecap="butt" stroke-linejoin="miter" d="M31 17v12.5H14V17"/>
      <path d="m31 29.5 1.5 2.5h-20l1.5-2.5"/>
      <path fill="none" stroke-linejoin="miter" d="M11 14h23"/>
    </g>
  </g>
</svg>
